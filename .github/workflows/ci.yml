name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # voice deps need portaudio, tests don't touch audio so skip them
      - run: pip install requests scikit-learn joblib numpy pytest ruff
      - run: ruff check .
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests scikit-learn joblib numpy matplotlib
      - run: python experiments/run_benchmark.py --quick

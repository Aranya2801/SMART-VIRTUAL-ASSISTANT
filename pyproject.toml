[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-assistant"
version = "3.0.0"
description = "A small offline-first voice assistant with a learned intent model and out-of-scope detection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aranya Ghosh" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "scikit-learn>=1.3", "joblib>=1.3", "numpy>=1.24"]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff"]

[project.scripts]
aria = "aria.__main__:main"

[tool.setuptools.packages.find]
include = ["aria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B905"]
